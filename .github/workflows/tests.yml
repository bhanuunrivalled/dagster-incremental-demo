name: Pipeline tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.11.2
          uv sync --frozen
      - name: Verify incremental processing and retries
        run: uv run --frozen pytest -q
      - name: Run the complete demo
        run: uv run --frozen orders-demo demo
      - name: Run Foundry-style code on real Spark
        run: uv run --frozen foundry-demo demo
